name: 不具合の報告
description: 表示崩れや動作の不具合を報告する
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        セキュリティ上の問題は、この Issue ではなく [SECURITY.md](https://github.com/Onga-Mirai-Tech/ongatown-kosodate-support-navi/blob/main/SECURITY.md) の方法で非公開にご連絡ください。
  - type: textarea
    id: what
    attributes:
      label: 起きたこと
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. 「入園・入学・利用の手続き」タブを開く
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
  - type: input
    id: env
    attributes:
      label: 端末・ブラウザ
      placeholder: 例）iPhone 15 / Safari、Windows / Chrome
